stages:
  - build
  - integration-test

default:
  tags:
    - saas-linux-small-amd64

services:
  - name: docker:dind
    # explicitly disable tls to avoid docker startup interruption
    command: ["--tls=false"]

variables:
  # Instruct Testcontainers to use the daemon of DinD, use port 2375 for non-tls connections.
  DOCKER_HOST: "tcp://docker:2375"
  # Instruct Docker not to start over TLS.
  DOCKER_TLS_CERTDIR: ""
  # Improve performance with overlayfs.
  DOCKER_DRIVER: overlay2
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  key: maven
  paths:
    - .m2/repository
    - basisprojekt-client/.cache/ms-playwright

# tag::maven-build[]
maven-build:
  stage: build
  image: maven:3.9.9-eclipse-temurin-21
  variables:
    # The Vite dev server is started by Playwright BEFORE `globalSetup`,
    # so we must set the proxy target statically in the job environment here.
    # In the DinD setup, the backend stack is reachable via the service alias `docker`.
    VITE_BACKEND_ENDPOINT: "http://docker:8080"
    # Playwright stores browser binaries under ~/.cache/ms-playwright/ by default.
    # We redirect them to a path within the project directory so that the
    # GitLab cache (see `cache:` above) can reuse them between builds.
    PLAYWRIGHT_BROWSERS_PATH: "${CI_PROJECT_DIR}/basisprojekt-client/.cache/ms-playwright"
  before_script:
    - echo api.version=1.44 >> ~/.docker-java.properties
    # Chromium runtime dependencies for Playwright (see https://playwright.dev/docs/ci#system-dependencies)
    # plus curl/ca-certificates for the Docker CLI download.
    # The `t64` suffixes apply starting with Ubuntu 24.04 (Noble); on Jammy there are transitional packages with the same name.
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends
        libnss3 libnspr4 libdbus-1-3 libdrm2 libgbm1 libxkbcommon0
        libpango-1.0-0 libcairo2 libx11-6 libxcb1 libxext6
        libxcomposite1 libxdamage1 libxfixes3 libxrandr2
        libatk1.0-0t64 libatk-bridge2.0-0t64 libatspi2.0-0t64
        libasound2t64 libcups2t64
        curl ca-certificates
    # Testcontainers' DockerComposeEnvironment internally spawns `docker compose`,
    # so the CLI + Compose plugin must be present in the image.
    - curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-27.5.1.tgz -o /tmp/docker.tgz
    - tar -xzf /tmp/docker.tgz -C /tmp
    - install -m 0755 /tmp/docker/docker /usr/local/bin/docker
    - mkdir -p /usr/local/lib/docker/cli-plugins
    - curl -fsSL https://github.com/docker/compose/releases/download/v2.32.4/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose
    - chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
  script:
    - mvn clean install
  artifacts:
    paths:
      - basisprojekt-server/target/
    expire_in: 1 week
# end::maven-build[]

docker-compose:
  stage: integration-test
  image: docker:cli
  before_script:
    - apk add --no-cache curl
  script:
    - echo "Starting docker-compose..."
    - docker-compose up -d
    - echo "Testing Start Page..."
    - RESPONSE=$(curl --retry 20 --retry-all-errors -sf http://docker:8080/)
    - echo "$RESPONSE" | grep -q "Basisprojekt" || (echo "❌ index.html not found!"; exit 1)
    - echo "✅ Start Page found";
    - echo "Testing REST Call..."
    - RESPONSE=$(curl -sf http://docker:8080/api/customers)
    - echo "$RESPONSE" | grep -q "firstName" || (echo "❌ Customers API not found!"; exit 1)
    - echo "✅ Customers API found."
  after_script:
    - docker compose down
